server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API и сокет живут на том же origin, что и статика: адрес бэкенда не
    # вшивается в бандл, туннель нужен один, а Mini App не упирается ни в CORS,
    # ни в mixed content. Имя backend резолвим через DNS Docker на каждый
    # запрос (resolver + переменная), иначе nginx падает на старте, если
    # контейнер бэкенда ещё не поднялся.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_backend http://backend:3000;

        # Префикс /api существует только для фронта: бэкенд слушает пути без него.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /socket.io/ {
        resolver 127.0.0.11 valid=10s;
        set $ws_backend http://backend:3000;
        proxy_pass $ws_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Соединение живёт всю партию — дефолтные 60s рвали бы его в лобби.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA-фолбэк: любой неизвестный путь отдаёт index.html,
    # иначе прямой заход на /profile вернёт 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico|mp3)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
