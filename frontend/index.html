<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7C5CFF" />
    <!--
      Озвучка вопросов — ссылка на translate.google.com, а тот отвечает 404 на
      любой запрос с заголовком Referer (защита от хотлинка). Для <audio> этот
      заголовок не отключить поштучно: referrerPolicy есть у img/iframe/script,
      но не у медиаэлементов. Поэтому политика задаётся документу целиком.
      Своему API Referer не нужен, так что терять нечего.
    -->
    <meta name="referrer" content="no-referrer" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237C5CFF'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='20' font-weight='bold' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E"
    />
    <title>GuessAI</title>
    <!--
      Официальный скрипт Telegram грузится синхронно до бандла: он создаёт
      window.Telegram.WebApp, который служит фолбэком, если @telegram-apps/sdk-react
      не смог инициализироваться в текущей версии вебвью.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
